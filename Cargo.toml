[workspace]
resolver = "2"
exclude = [
  "web",
  "system-bundles/workflow-compiler/.clusterflux",
]
members = [
  "crates/clusterflux-artifact-transfer",
  "crates/clusterflux-relay",
  "crates/clusterflux-cli",
  "crates/clusterflux-client",
  "crates/clusterflux-coordinator",
  "crates/clusterflux-core",
  "crates/clusterflux-dap",
  "crates/clusterflux-macros",
  "crates/clusterflux-node",
  "crates/clusterflux-protocol",
  "crates/clusterflux-sdk",
  "crates/clusterflux-source",
  "crates/clusterflux-wasm-runtime",
  "system-bundles/workflow-compiler/driver",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lesstuff/clusterflux"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
ed25519-dalek = "2"
futures-executor = "0.3"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
iroh = { version = "=1.0.3", default-features = false, features = ["metrics", "portmapper", "tls-ring"] }
iroh-relay = { version = "=1.0.3", default-features = false, features = ["metrics", "server", "tls-ring"] }
libc = "0.2"
proc-macro2 = "1.0"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syn = { version = "2.0", features = ["full"] }
tempfile = "3.10"
time = { version = "0.3", features = ["parsing"] }
thiserror = "1.0"
toml = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
httpdate = "1.0"
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
wasmtime = { version = "=43.0.2", default-features = false, features = ["async", "cranelift", "debug", "runtime", "std", "wat"] }
wasmparser = "0.245.1"
wait-timeout = "0.2"
zeroize = "1.8"

# Omit full debug information in routine validation builds. Cargo's normal
# incremental compilation and host-selected parallelism remain enabled.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Rust's default optimized profile performs thin-local LTO across each crate's
# codegen units. Keep release packaging on the ordinary object-code path so a
# compiler-side ThinLTO failure cannot make otherwise identical builds flaky.
[profile.release]
lto = "off"
panic = "abort"
strip = "symbols"
